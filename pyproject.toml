[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "navigator"
version = "0.1.0"
description = "CLI that chats with Claude and learns your preferences over time"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "claude-agent-sdk",
    "anthropic",
    "ollama>=0.4.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
]

[project.scripts]
navigator = "navigator.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["navigator*"]
